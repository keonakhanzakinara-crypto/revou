<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="container">

    <!-- ======= GREETING ======= -->
    <section class="card greeting-card">
      <div class="greeting-left">
        <h1>
          <span id="greeting-text">Good morning,</span>
          <span class="name-wrapper">
            <span id="greeting-name" class="greeting-name" title="Click to edit your name">Friend</span>
            <input id="greeting-name-input" class="greeting-name-input" type="text" maxlength="30" placeholder="Your name" />
          </span>
          <span class="greeting-wave">👋</span>
        </h1>
        <p>Here's your personal focus dashboard.</p>
      </div>
      <div class="greeting-right">
        <div id="clock">00:00:00</div>
        <div id="date">Loading date…</div>
      </div>
    </section>

    <!-- ======= FOCUS TIMER ======= -->
    <section class="card timer-card">
      <h2>⏱ Focus Timer</h2>

      <div class="timer-display">
        <div id="timer-time">25:00</div>
        <div class="timer-label" id="timer-label">25-minute focus session</div>
      </div>

      <div class="timer-progress">
        <div class="timer-progress-bar" id="timer-progress-bar"></div>
      </div>

      <div class="timer-controls">
        <button class="btn btn-primary" id="timer-start">▶ Start</button>
        <button class="btn btn-secondary" id="timer-stop">⏹ Stop</button>
        <button class="btn btn-secondary" id="timer-reset">↺ Reset</button>
      </div>

      <div class="timer-duration-row">
        <label for="timer-duration-input">Duration:</label>
        <input
          type="number"
          id="timer-duration-input"
          min="1"
          max="120"
          value="25"
        />
        <span>min</span>
        <button class="btn btn-secondary" id="timer-set-btn">Set</button>
      </div>
    </section>

    <!-- ======= TO-DO LIST ======= -->
    <section class="card todo-card">
      <h2>✅ To-Do List</h2>

      <div class="todo-input-row">
        <input
          type="text"
          id="todo-input"
          placeholder="Add a new task…"
          maxlength="200"
        />
        <button class="btn btn-primary" id="todo-add-btn">Add</button>
      </div>
      <p class="todo-duplicate-msg" id="todo-duplicate-msg"></p>

      <ul class="todo-list" id="todo-list"></ul>

      <div class="todo-footer">
        <span id="todo-counter">0/0 done</span>
        <button class="btn btn-secondary" id="todo-clear-btn" style="font-size:0.75rem; padding:4px 10px;">Clear done</button>
      </div>
    </section>

    <!-- ======= QUICK LINKS ======= -->
    <section class="card links-card">
      <div class="links-header">
        <h2>🔗 Quick Links</h2>
        <button class="btn btn-secondary" id="toggle-add-link-btn" style="font-size:0.8rem; padding:6px 12px;">+ Add Link</button>
      </div>

      <div class="links-grid" id="links-grid"></div>

      <div class="add-link-form" id="add-link-form">
        <input
          type="text"
          id="link-name-input"
          placeholder="Name (e.g. GitHub)"
          maxlength="40"
        />
        <input
          type="text"
          id="link-url-input"
          placeholder="URL (e.g. github.com)"
          maxlength="200"
        />
        <button class="btn btn-primary" id="link-save-btn">Save</button>
      </div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
